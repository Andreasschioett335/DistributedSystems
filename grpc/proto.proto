syntax = "proto3";

package mutex;
option go_package = "DistributedSystems/mutexpb";

// Service for Ricart-Agrawala mutual exclusion
service MutexService {
  // Request access to critical section
  rpc Request(RequestMessage) returns (ReplyMessage);

  // Reply to a request (used for deferred replies)
  rpc Reply(ReplyMessage) returns (Ack);
}

// Request message sent when a node wants to enter critical section
message RequestMessage {
  string node_id = 1;      // ID of the requesting node
  int64 timestamp = 2;      // Lamport timestamp of the request
}

// Reply message sent to grant permission
message ReplyMessage {
  string node_id = 1;      // ID of the replying node
}

// Acknowledgment message
message Ack {
  // Empty acknowledgment
}
